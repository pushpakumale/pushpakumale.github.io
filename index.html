<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Pushpak Umale</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            color: var(--text-color);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            transition: background-image 1s ease-in-out;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.85) 100%);
            z-index: 1;
        }

        #bg-quote-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
            z-index: 2;
            opacity: 0.12;
            pointer-events: none;
        }

        #bg-quote {
            font-size: clamp(2rem, 6vw, 7rem);
            font-weight: 600;
            line-height: 1.2;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #main {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            max-width: 1000px;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            animation: fadeInDown 1s ease-out;
        }

        header h1 {
            font-size: 3.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.9;
            letter-spacing: 1px;
            margin-bottom: 1.5rem;
        }

        .skills {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        .skill-pill {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .resume-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            padding: 0.8rem 2rem;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            margin-bottom: 3rem;
        }

        .resume-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .tiles-container {
            display: flex;
            justify-content: center;
            gap: 2.5rem;
            flex-wrap: wrap;
        }

        .tile {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            border-left: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            padding: 3rem 2rem;
            width: 190px;
            text-decoration: none;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, box-shadow 0.3s;
            animation: float 6s ease-in-out infinite;
        }

        .tile:nth-child(1) { animation-delay: 0s; }
        .tile:nth-child(2) { animation-delay: 1.5s; }
        .tile:nth-child(3) { animation-delay: 3s; }

        .tile i {
            font-size: 3.5rem;
            transition: transform 0.3s, color 0.3s;
        }

        .tile span {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .tile:hover {
            transform: translateY(-20px) scale(1.05);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 40px 0 rgba(0, 0, 0, 0.5);
            animation-play-state: paused;
        }

        .tile:hover i { transform: scale(1.2); }
        .tile.linkedin:hover i { color: #0077b5; }
        .tile.github:hover i { color: #ffffff; }
        .tile.email:hover i { color: #ea4335; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .tiles-container { gap: 1.5rem; }
            .tile { width: 150px; padding: 2rem 1rem; }
            .tile i { font-size: 2.5rem; }
            header h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body class="is-preload">

    <div id="overlay"></div>

    <div id="bg-quote-container">
        <h1 id="bg-quote"></h1>
    </div>

    <div id="main">
        <header id="header">
            <h1>Pushpak Umale</h1>
            <p>Associate Consultant &nbsp;&bull;&nbsp; Data Analyst &nbsp;&bull;&nbsp; Capgemini</p>
            
            <div class="skills">
                <span class="skill-pill">SQL</span>
                <span class="skill-pill">Python</span>
                <span class="skill-pill">Power BI</span>
                <!-- Replaced Tableau with Machine Learning -->
                <span class="skill-pill">Machine Learning</span>
                <span class="skill-pill">Excel</span>
            </div>

            <!-- The href points to the exact name of the file you will upload -->
            <a href="Pushpak_Umale_Resume_DA&BI3.pdf" class="resume-btn" download="Pushpak_Umale_Resume.pdf"><i class="fas fa-file-download"></i> Download Resume</a>
        </header>

        <div class="tiles-container">
            <a href="https://www.linkedin.com/in/pushpakumale" target="_blank" class="tile linkedin">
                <i class="fab fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>
            
            <a href="https://github.com/pushpakumale" target="_blank" class="tile github">
                <i class="fab fa-github"></i>
                <span>GitHub</span>
            </a>
            
            <a href="mailto:pushpakumale.careerinfo@gmail.com" class="tile email">
                <i class="fas fa-envelope"></i>
                <span>Email</span>
            </a>
        </div>
    </div>

    <script>
        const dataImages = [
            'https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1504868584819-f8e8b4b6d7e3?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1526374965328-7f61d4dc18c5?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1460925895917-afdab827c52f?q=80&w=1920&auto=format&fit=crop',
            'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?q=80&w=1920&auto=format&fit=crop' 
        ];

        const quotes = [
            '"Without data, you’re just another person with an opinion." – W. Edwards Deming',
            '"Data is the new oil." – Clive Humby',
            '"In God we trust, all others must bring data." – W. Edwards Deming',
            '"Torture the data, and it will confess to anything." – Ronald Coase',
            '"The goal is to turn data into information, and information into insight." – Carly Fiorina',
            '"Data really powers everything that we do." – Jeff Weiner',
            '"Numbers have an important story to tell. They rely on you to give them a voice." – Stephen Few'
        ];

        const randomImageIndex = Math.floor(Math.random() * dataImages.length);
        const randomQuoteIndex = Math.floor(Math.random() * quotes.length);
        
        document.getElementById("bg-quote").textContent = quotes[randomQuoteIndex];

        const bgImageUrl = dataImages[randomImageIndex];
        
        const img = new Image();
        img.src = bgImageUrl;
        img.onload = () => {
            document.body.style.backgroundImage = `url('${bgImageUrl}')`;
        };

        document.addEventListener("mousemove", (e) => {
            const tiles = document.querySelectorAll(".tile");
            const x = (window.innerWidth / 2 - e.pageX) / 40;
            const y = (window.innerHeight / 2 - e.pageY) / 40;
            
            tiles.forEach(tile => {
                if(!tile.matches(':hover')) {
                    tile.style.transform = `translateY(${y}px) translateX(${x}px)`;
                }
            });
        });

        document.addEventListener("mouseleave", () => {
            document.querySelectorAll(".tile").forEach(tile => {
                tile.style.transform = '';
            });
        });
    </script>
</body>
</html>
